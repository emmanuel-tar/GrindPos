  <script>
    // Bulletproof third-party extension error interceptor (MetaMask, Web3, injected extension scripts)
    (function() {
      function isIgnored(arg) {
        if (!arg) return false;
        var str = '';
        if (typeof arg === 'string') {
          str = arg;
        } else if (arg && arg.message) {
          str = String(arg.message);
        } else if (arg && arg.stack) {
          str = String(arg.stack);
        } else {
          try { str = JSON.stringify(arg); } catch(e) { str = String(arg); }
        }
        return /MetaMask|ethereum|web3|Failed to connect|inpage|chrome-extension|moz-extension/i.test(str);
      }

      // 1. Filter console.error and console.warn from third-party extensions
      var origError = console.error;
      var origWarn = console.warn;
      console.error = function() {
        for (var i = 0; i < arguments.length; i++) {
          if (isIgnored(arguments[i])) return;
        }
        return origError.apply(console, arguments);
      };

      console.warn = function() {
        for (var i = 0; i < arguments.length; i++) {
          if (isIgnored(arguments[i])) return;
        }
        return origWarn.apply(console, arguments);
      };

      // 2. Intercept window unhandled rejection & global error events in capture phase
      function handleRejection(e) {
        var reason = (e && e.reason && (e.reason.message || e.reason.stack || e.reason.toString())) || '';
        if (isIgnored(reason) || isIgnored(e.reason)) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }

      function handleError(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        var src = (e && e.filename) || '';
        if (isIgnored(msg) || isIgnored(src) || isIgnored(e.error)) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }

      window.addEventListener('unhandledrejection', handleRejection, true);
      window.addEventListener('error', handleError, true);
      window.onunhandledrejection = handleRejection;
      window.onerror = function(msg, url, line, col, error) {
        if (isIgnored(msg) || isIgnored(url) || isIgnored(error)) {
          return true;
        }
      };
    })();
  </script>
